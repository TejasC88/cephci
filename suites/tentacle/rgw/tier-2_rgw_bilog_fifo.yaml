            timeout: 3600

  - test:
      name: FIFO bilog multisite sync
      desc: PUT full-sync outage and versioned OLH sync
      polarion-id: TBD
      module: sanity_rgw_multisite.py
      clusters:
        ceph-pri:
          config:
            script-name: test_bilog_fifo.py
            config-file-name: test_bilog_fifo_multisite_sync.yaml
            verify-io-on-site: ["ceph-sec"]
            timeout: 7200

  - test:
      name: FIFO bilog trim lagging secondary
      desc: autotrim must not drop unconsumed entries
      polarion-id: TBD
      module: sanity_rgw_multisite.py
      clusters:
        ceph-pri:
          config:
            script-name: test_bilog_fifo.py
