  - test:
      name: FIFO bilog inindex compat
      desc: InIndex PUT DELETE versioned trim status still work
      polarion-id: TBD
      module: sanity_rgw_multisite.py
      clusters:
        ceph-pri:
          config:
            script-name: test_bilog_fifo.py
            config-file-name: test_bilog_fifo_inindex_compat.yaml
            timeout: 1800
